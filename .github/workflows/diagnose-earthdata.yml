name: Diagnose Earthdata connection (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mikawa-earthdata-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install hyp3-sdk==7.7.8
      - name: Trace read-only Earthdata and HyP3 access
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: python -m scripts.diagnose_earthdata
