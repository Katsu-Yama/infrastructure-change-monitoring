name: Deploy InSAR web
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'scripts/build.mjs', 'scripts/ensure-pages.mjs', 'scripts/export_snapshot.py', '.github/workflows/deploy.yml', 'package*.json']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Verify settings
        run: |
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::$name is not configured"; exit 1; fi
          done
      - name: Preserve latest published monitoring snapshot
        run: python -m scripts.export_snapshot
      - run: npm run build
      - run: npm run deploy
