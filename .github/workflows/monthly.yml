name: Monthly InSAR monitoring
on:
  schedule:
    - cron: '17 20 1 * *' # 毎月2日05:17 JST。新観測と処理時刻は別に保存。
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mikawa-monthly
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      INSAR_SOURCE: ${{ vars.INSAR_SOURCE || 'sentinel' }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment settings
        run: |
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::$name is not configured"; exit 1; fi
          done
          if [ "$INSAR_SOURCE" = sentinel ]; then
            for name in EARTHDATA_USERNAME EARTHDATA_PASSWORD; do
              if [ -z "${!name}" ]; then echo "::error::$name is not configured"; exit 1; fi
            done
          fi
      - uses: actions/setup-python@v5
        if: env.INSAR_SOURCE == 'gsi'
        with:
          python-version: '3.11'
      - uses: mamba-org/setup-micromamba@v2
        if: env.INSAR_SOURCE == 'sentinel'
        with:
          environment-file: environment.yml
          init-shell: bash
          cache-environment: false
      - run: pip install -r requirements.txt
        if: env.INSAR_SOURCE == 'gsi'
      - run: pip install -r requirements-insar.txt
        if: env.INSAR_SOURCE == 'sentinel'
      - run: python -m unittest discover -s tests -v
      - name: Verify private storage and Earthdata connections (read-only)
        if: env.INSAR_SOURCE == 'sentinel'
        timeout-minutes: 5
        run: python -m scripts.verify_connections
      - name: Collect and analyze real InSAR data
        run: python -m scripts.run --source "$INSAR_SOURCE"
      - name: Store in Supabase and verify readback
        run: python -m scripts.publish
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Deploy static report to Cloudflare Pages
        run: npm run deploy
      - name: Report provenance
        if: success()
        run: |
          python -c "import json,os; r=json.load(open('output/report.json')); f=open(os.environ['GITHUB_STEP_SUMMARY'],'a'); f.write('### Mikawa InSAR\nMonth: '+r['report_month']+'\nLast observed: '+r['last_observed']+'\nMode: '+r['mode']+'\nCandidates: '+str(r['summary']['candidate_count'])+'\n')"
